name: 🔄 CD · Snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      maven_central:
        description: Maven Central.
        required: true
        default: true
        type: boolean
      github_packages:
        description: GitHub Packages.
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: build-main-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: read
      packages: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_release.yml@bb8dbcb2788d76ae4dfcc96ab2c1e0cdbd0a52c8
    with:
      semver_strategy: snapshot
      upstream_repository: nats-io/nats-streaming-server
      dry_run: ${{ github.event_name == 'workflow_dispatch' && (inputs.maven_central != true || inputs.github_packages != true) }}
    secrets:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}

  central:
    needs:
      - release
    if: ${{ always() && !cancelled() && needs.release.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_publish_central.yml@bb8dbcb2788d76ae4dfcc96ab2c1e0cdbd0a52c8
    secrets:
      CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
      CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  packages:
    needs:
      - release
    if: ${{ always() && !cancelled() && needs.release.result == 'success' }}
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_publish_github_packages.yml@bb8dbcb2788d76ae4dfcc96ab2c1e0cdbd0a52c8
